    async function loadSettings() {
      try {
        const resp = await fetch('/api/settings');
        const data = await resp.json();
        if (data.status === 'ok') {
          const s = data.settings;
          document.getElementById('s-api-key').value = s.api_key || '';
          document.getElementById('s-base-url').value = s.base_url || '';
          document.getElementById('s-temperature').value = s.temperature || 0.3;
          document.getElementById('s-temp-val').textContent = s.temperature || 0.3;

          const modelSelect = document.getElementById('s-model');
          const modelCustom = document.getElementById('s-model-custom');
          const presetModels = ['gpt-3.5-turbo', 'gpt-4o', 'deepseek-chat', 'qwen-turbo', 'glm-4'];
          if (presetModels.includes(s.model_name)) {
            modelSelect.value = s.model_name;
            modelCustom.style.display = 'none';
          } else if (s.model_name) {
            modelSelect.value = '__custom__';
            modelCustom.value = s.model_name;
            modelCustom.style.display = 'block';
          }
        }
      } catch (e) {
        console.error('Failed to load settings:', e);
      }
    }

      const btn = document.getElementById('save-settings-btn');

        const modelCustom = document.getElementById('s-model-custom');
        const modelName = modelSelect.value === '__custom__'
          ? modelCustom.value.trim()
          : modelSelect.value;

        const resp = await fetch('/api/settings', {
          method: 'POST',

    // ================================================================
    // Toast 提示
    // ================================================================
    function showToast(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `toast toast-${type}`;
      div.textContent = message;
      toastContainer.appendChild(div);
      setTimeout(() => div.classList.add('toast-out'), 100);
      setTimeout(() => div.remove(), 3000);
    }

    // ================================================================
    function escHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML.replace(/\n/g, '<br>');
    }

    function createMessageBubble(role, content) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-bubble ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = `<div class="msg-role">${role === 'user' ? ''👤' : '🤖'}</div>`
                    + `<div class="msg-text">${escHtml(content)}</div>`;

      wrapper.appendChild(avatar);
      wrapper.appendChild(body);
      return wrapper;
    }

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-bubble assistant';

      avatar.className = 'avatar';

    function createSourcesBlock(sources) {
      const block = document.createElement('div');
      block.className = 'sources-block';

      const header = document.createElement('div');
      header.className = 'sources-header';
      header.innerHTML = `<span class="sources-icon">📌</span><span>参考来源/span>`
                       + `<span class="sources-toggle">▶ 展开</span>`;
      header.addEventListener('click', () => {
        const list = block.querySelector('.sources-list');
        const isOpen = list.style.display !== 'none';
        list.style.display = isOpen ? 'none' : 'block';
        header.querySelector('.sources-toggle').textContent = isOpen ? '▶ 展开' : '▼ 收起';
      });

      const list = document.createElement('div');
      list.className = 'sources-list';
      list.style.display = 'none';

      sources.forEach(src => {
        const item = document.createElement('div');
        item.className = 'source-item';
        const title = document.createElement('div');
        title.className = 'source-title';
        title.textContent = `📄 ${src.file}  #${src.idx}`;
        const snippet = document.createElement('div');
        snippet.className = 'source-snippet';
        snippet.textContent = src.text;
        item.appendChild(title);
        item.appendChild(snippet);
        list.appendChild(item);
      });

      block.appendChild(header);
      block.appendChild(list);
      return block;
    }

        const items = [
          { label: 'API 配置',  ok: d.api_configured },

        statusInfo.innerHTML = items.map(it =>

            </span>
          </div>`

    // ================================================================
    // 📋 文档管理：获取文档列表    // ================================================================
    async function loadDocuments() {
      try {
        const resp = await fetch('/api/documents');
        const d = await resp.json();
        if (d.status !== 'ok') {
          docList.innerHTML = '<p class="doc-empty">加载失败</p>';
          return;
        }
        const docs = d.documents || [];
        if (docs.length === 0) {
          docList.innerHTML = '<p class="doc-empty">向量库为空，请先上传文档.../p>';
          return;
        }
        docList.innerHTML = docs.map(doc => `
          <div class="doc-item" data-filename="${escHtml(doc.filename)}">
            <div class="doc-info">
              <span class="doc-name" title="${escHtml(doc.filename)}">📄 ${escHtml(doc.filename)}</span>
              <span class="doc-chunks">${doc.chunks} 个片段/span>
            </div>
            <button class="btn btn-delete" onclick="deleteDoc('${escHtml(doc.filename).replace(/'/g, "\\'")}')">删除</button>
          </div>
        `).join('');
      } catch (e) {
        docList.innerHTML = '<p class="doc-empty">加载失败</p>';
      }
    }

    // ================================================================
    // 📤 流式发送问题    // ================================================================
    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      removeWelcome();

      // 先创建助手气泡，文字为空（流式填充）
      const { wrapper: bubble, textEl } = createAssistantBubble();
      chatContainer.appendChild(bubble);
      scrollToBottom();

      sendBtn.disabled = true;
      sendBtn.textContent = '⏳';
      questionInput.value = '';

      try {
        // 使用 ReadableStream 读取 SSE
        const resp = await fetch('/api/chat-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);

        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();  // 最后一行可能不完整，留到下一行
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6).trim();
            if (!payload) continue;

            let event;
            try { event = JSON.parse(payload); } catch (_) { continue; }

            if (event.type === 'token') {
              // 逐字追加回答内容
              textEl.innerHTML += escHtml(event.content);
              scrollToBottom();

            } else if (event.type === 'sources') {
              // 收到来源信息，挂到气泡下方              const sourcesEl = createSourcesBlock(event.sources);
              bubble.appendChild(sourcesEl);
              scrollToBottom();

            } else if (event.type === 'done') {
              // 完成，保存到历史
              const fullAnswer = textEl.textContent || textEl.innerText || '';
              saveToHistory(question, fullAnswer);

            } else if (event.type === 'error') {
              showToast(event.message || '发生错误', 'error');
            }
          }
        }

      } catch (e) {
        showToast('网络错误！ + e.message, 'error');
        textEl.innerHTML = '⚠️ 请求失败，请检查后端服务是否启动？;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '发送;
      }
    }

      } catch (_) { /* 静默失败 */ }
    }

    // 文件上传流程
    // ================================================================
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      selectedFile = fileInput.files[0];
      if (selectedFile) {
        uploadArea.querySelector('p').innerHTML =
          `已选择：strong>${selectedFile.name}</strong>`;
        uploadBtn.style.display = 'inline-block';
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      uploadBtn.textContent = '上传中...;

      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✅ ${data.message}`, 'success');
          uploadArea.querySelector('p').innerHTML =
            '<span class="upload-icon">📁</span><p>点击选择文件<br><small>支持 .txt / .md，最大 5 MB</small></p>';
          uploadBtn.style.display = 'none';
          fileInput.value = '';
          selectedFile = null;
          loadStatus();
          loadDocuments();
        } else {
          showToast('❌ ' + data.message, 'error');
        }
      } catch (e) {
        showToast('上传失败！ + e.message, 'error');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '确认上传';
      }
    });
