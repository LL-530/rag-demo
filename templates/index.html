<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 问答 Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <!-- ========== 左侧边栏 ========== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📚 RAG Demo</h1>
        <p class="subtitle">基于检索增强生成的 AI 问答系统</p>
      </div>

      <!-- 状态面�?-->
      <div class="status-panel">
        <h3>�?系统状�?/h3>
        <div id="status-info" class="status-items">加载中�?/div>
      </div>

      <!-- 文档上传 -->
      <div class="section">
        <h3>📄 上传文档</h3>
        <div class="upload-area" id="upload-area">
          <span class="upload-icon">📁</span>
          <p>点击选择文件<br><small>支持 .txt / .md，最�?5 MB</small></p>
          <input type="file" id="file-input" accept=".txt,.md,.pdf" hidden />
        </div>
        <button class="btn btn-secondary" id="upload-btn" style="display:none">确认上传</button>
      </div>

      <!-- 粘贴文本 -->
      <div class="section">
        <h3>�?粘贴文本</h3>
        <textarea id="paste-text" placeholder="在此粘贴要入库的文本内容�?></textarea>
        <button class="btn btn-primary" id="paste-btn">入库</button>
      </div>

      <!-- �?新增：文档管理面�?-->
      <div class="section doc-mgmt-section">
        <h3>📂 文档管理</h3>
        <div id="doc-list" class="doc-list">
          <p class="doc-empty">加载中�?/p>
        </div>
        <button class="btn btn-secondary" id="refresh-docs-btn" style="margin-top:8px">🔄 刷新列表</button>
      </div>

      <!-- 快捷操作 -->
      <div class="section">
        <h3>�?操作</h3>
        <button class="btn btn-danger" id="clear-history-btn">🗑 清空对话历史</button>
      </div>

      <div class="sidebar-footer">
        <small>Flask + LangChain + ChromaDB</small>
      </div>
    </aside>

    <!-- ========== 右侧主内�?========== -->
    <main class="main">
      <div class="chat-container" id="chat-container">
        <!-- 欢迎消息 -->
        <div class="welcome-card">
          <div class="welcome-icon">🤖</div>
          <h2>你好，我�?RAG 问答助手</h2>
          <p>在下方输入问题，我会基于已上传的文档为你检索并生成回答�?/p>
          <div class="suggestions">
            <button class="chip" onclick="fillQuestion('人工智能的发展历程是怎样的？')">
              人工智能的发展历程是怎样的？
            </button>
            <button class="chip" onclick="fillQuestion('什么是图灵测试�?)">
              什么是图灵测试�?            </button>
            <button class="chip" onclick="fillQuestion('深度学习革命始于什么时候？')">
              深度学习革命始于什么时候？
            </button>
            <button class="chip" onclick="fillQuestion('AI 安全与对齐面临哪些挑战？')">
              AI 安全与对齐面临哪些挑战？
            </button>
          </div>
        </div>
      </div>

      <!-- 输入�?-->
      <div class="input-bar">
        <input
          type="text"
          id="question-input"
          placeholder="输入你的问题，按 Enter 发送�?
          autocomplete="off"
        />
        <button class="btn btn-send" id="send-btn">发�?/button>
      </div>
    </main>
  </div>

  <!-- ========== 提示弹窗 ========== -->
  <div id="toast-container"></div>

  <!-- ========== JavaScript ========== -->
  <script>
    // ---- DOM 元素引用 ----
    const uploadArea      = document.getElementById('upload-area');
    const fileInput       = document.getElementById('file-input');
    const uploadBtn       = document.getElementById('upload-btn');
    const pasteText       = document.getElementById('paste-text');
    const pasteBtn        = document.getElementById('paste-btn');
    const questionInput   = document.getElementById('question-input');
    const sendBtn         = document.getElementById('send-btn');
    const chatContainer   = document.getElementById('chat-container');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const statusInfo      = document.getElementById('status-info');
    const toastContainer  = document.getElementById('toast-container');
    const docList         = document.getElementById('doc-list');
    const refreshDocsBtn  = document.getElementById('refresh-docs-btn');

    // ---- 当前选中的文�?----
    let selectedFile = null;

    // ================================================================
    // Toast 提示
    // ================================================================
    function showToast(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `toast toast-${type}`;
      div.textContent = message;
      toastContainer.appendChild(div);
      setTimeout(() => div.classList.add('toast-out'), 100);
      setTimeout(() => div.remove(), 3000);
    }

    // ================================================================
    // 辅助：HTML 转义
    // ================================================================
    function escHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML.replace(/\n/g, '<br>');
    }

    // ================================================================
    // 辅助：滚动到底部
    // ================================================================
    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ================================================================
    // 辅助：移除欢迎卡
    // ================================================================
    function removeWelcome() {
      const w = document.querySelector('.welcome-card');
      if (w) w.remove();
    }

    // ================================================================
    // 构建对话气泡（普通版�?    // ================================================================
    function createMessageBubble(role, content) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-bubble ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = `<div class="msg-role">${role === 'user' ? '�? : '助手'}</div>`
                    + `<div class="msg-text">${escHtml(content)}</div>`;

      wrapper.appendChild(avatar);
      wrapper.appendChild(body);
      return wrapper;
    }

    // ================================================================
    // 构建助手气泡容器（流式用，逐步追加内容 + 引用来源�?    // ================================================================
    function createAssistantBubble() {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-bubble assistant';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🤖';

      const body = document.createElement('div');
      body.className = 'msg-body';

      const roleEl = document.createElement('div');
      roleEl.className = 'msg-role';
      roleEl.textContent = '助手';

      const textEl = document.createElement('div');
      textEl.className = 'msg-text';

      body.appendChild(roleEl);
      body.appendChild(textEl);
      wrapper.appendChild(avatar);
      wrapper.appendChild(body);
      return { wrapper, textEl };
    }

    // ================================================================
    // 构建引用来源展示区块
    // ================================================================
    function createSourcesBlock(sources) {
      const block = document.createElement('div');
      block.className = 'sources-block';

      const header = document.createElement('div');
      header.className = 'sources-header';
      header.innerHTML = `<span class="sources-icon">📌</span><span>参考来�?/span>`
                       + `<span class="sources-toggle">�?展开</span>`;
      header.addEventListener('click', () => {
        const list = block.querySelector('.sources-list');
        const isOpen = list.style.display !== 'none';
        list.style.display = isOpen ? 'none' : 'block';
        header.querySelector('.sources-toggle').textContent = isOpen ? '�?展开' : '�?收起';
      });

      const list = document.createElement('div');
      list.className = 'sources-list';
      list.style.display = 'none';

      sources.forEach(src => {
        const item = document.createElement('div');
        item.className = 'source-item';
        const title = document.createElement('div');
        title.className = 'source-title';
        title.textContent = `📄 ${src.file}  #${src.idx}`;
        const snippet = document.createElement('div');
        snippet.className = 'source-snippet';
        snippet.textContent = src.text;
        item.appendChild(title);
        item.appendChild(snippet);
        list.appendChild(item);
      });

      block.appendChild(header);
      block.appendChild(list);
      return block;
    }

    // ================================================================
    // 填充示例问题
    // ================================================================
    function fillQuestion(q) {
      questionInput.value = q;
      questionInput.focus();
    }

    // ================================================================
    // 系统状�?    // ================================================================
    async function loadStatus() {
      try {
        const resp = await fetch('/api/status');
        const d = await resp.json();
        const items = [
          { label: 'API 配置',  ok: d.api_configured },
          { label: 'LLM 模型',  ok: d.llm_ready },
          { label: 'Embedding', ok: d.embeddings_ready },
          { label: '向量�?,    ok: d.vectorstore_ready },
        ];
        statusInfo.innerHTML = items.map(it =>
          `<div class="status-item">
            <span class="dot ${it.ok ? 'dot-green' : 'dot-red'}"></span>
            <span>${it.label}</span>
            <span class="status-badge ${it.ok ? 'badge-ok' : 'badge-err'}">
              ${it.ok ? '�?就绪' : '未就�?}
            </span>
          </div>`
        ).join('');
      } catch (e) {
        statusInfo.innerHTML = '<div class="status-item"><span class="dot dot-red"></span>无法连接后端</div>';
      }
    }

    // ================================================================
    // �?文档管理：获取文档列�?    // ================================================================
    async function loadDocuments() {
      try {
        const resp = await fetch('/api/documents');
        const d = await resp.json();
        if (d.status !== 'ok') {
          docList.innerHTML = '<p class="doc-empty">加载失败</p>';
          return;
        }
        const docs = d.documents || [];
        if (docs.length === 0) {
          docList.innerHTML = '<p class="doc-empty">向量库为空，请先上传文档�?/p>';
          return;
        }
        docList.innerHTML = docs.map(doc => `
          <div class="doc-item" data-filename="${escHtml(doc.filename)}">
            <div class="doc-info">
              <span class="doc-name" title="${escHtml(doc.filename)}">📄 ${escHtml(doc.filename)}</span>
              <span class="doc-chunks">${doc.chunks} 个片�?/span>
            </div>
            <button class="btn btn-delete" onclick="deleteDoc('${escHtml(doc.filename).replace(/'/g, "\\'")}')">删除</button>
          </div>
        `).join('');
      } catch (e) {
        docList.innerHTML = '<p class="doc-empty">加载失败</p>';
      }
    }

    // ================================================================
    // �?文档管理：删除文�?    // ================================================================
    async function deleteDoc(filename) {
      if (!confirm(`确定要删除�?{filename}」吗？此操作不可恢复。`)) return;
      try {
        const resp = await fetch('/api/documents', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename }),
        });
        const d = await resp.json();
        if (d.status === 'ok') {
          showToast(d.message, 'success');
          loadDocuments();
          loadStatus();
        } else {
          showToast('删除失败�? + d.message, 'error');
        }
      } catch (e) {
        showToast('删除失败�? + e.message, 'error');
      }
    }

    // ================================================================
    // �?流式发送问�?    // ================================================================
    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      removeWelcome();

      // 先创建助手气泡，文字为空（流式填充）
      const { wrapper: bubble, textEl } = createAssistantBubble();
      chatContainer.appendChild(bubble);
      scrollToBottom();

      sendBtn.disabled = true;
      sendBtn.textContent = '�?;
      questionInput.value = '';

      try {
        // 使用 ReadableStream 读取 SSE
        const resp = await fetch('/api/chat-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);

        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();  // 最后一行可能不完整，留到下一�?
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6).trim();
            if (!payload) continue;

            let event;
            try { event = JSON.parse(payload); } catch (_) { continue; }

            if (event.type === 'token') {
              // 逐字追加回答内容
              textEl.innerHTML += escHtml(event.content);
              scrollToBottom();

            } else if (event.type === 'sources') {
              // 收到来源信息，挂到气泡下�?              const sourcesEl = createSourcesBlock(event.sources);
              bubble.appendChild(sourcesEl);
              scrollToBottom();

            } else if (event.type === 'done') {
              // 完成，保存到历史
              const fullAnswer = textEl.textContent || textEl.innerText || '';
              saveToHistory(question, fullAnswer);

            } else if (event.type === 'error') {
              showToast(event.message || '发生错误', 'error');
            }
          }
        }

      } catch (e) {
        showToast('网络错误�? + e.message, 'error');
        textEl.innerHTML = '⚠️ 请求失败，请检查后端服务是否启动�?;
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '发�?;
      }
    }

    // ================================================================
    // 保存到对话历�?    // ================================================================
    async function saveToHistory(question, answer) {
      try {
        await fetch('/api/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, answer }),
        });
      } catch (_) { /* 静默失败 */ }
    }

    // ================================================================
    // 文件上传流程
    // ================================================================
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      selectedFile = fileInput.files[0];
      if (selectedFile) {
        uploadArea.querySelector('p').innerHTML =
          `已选择�?strong>${selectedFile.name}</strong>`;
        uploadBtn.style.display = 'inline-block';
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      uploadBtn.textContent = '上传中�?;

      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`�?${data.message}`, 'success');
          uploadArea.querySelector('p').innerHTML =
            '<span class="upload-icon">📁</span><p>点击选择文件<br><small>支持 .txt / .md，最�?5 MB</small></p>';
          uploadBtn.style.display = 'none';
          fileInput.value = '';
          selectedFile = null;
          loadStatus();
          loadDocuments();
        } else {
          showToast('�?' + data.message, 'error');
        }
      } catch (e) {
        showToast('上传失败�? + e.message, 'error');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '确认上传';
      }
    });

    // ================================================================
    // 粘贴文本入库
    // ================================================================
    pasteBtn.addEventListener('click', async () => {
      const text = pasteText.value.trim();
      if (!text) { showToast('请先粘贴文本内容�?, 'error'); return; }

      pasteBtn.disabled = true;
      pasteBtn.textContent = '入库中�?;

      try {
        const resp = await fetch('/api/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`�?${data.message}`, 'success');
          pasteText.value = '';
          loadStatus();
          loadDocuments();
        } else {
          showToast('�?' + data.message, 'error');
        }
      } catch (e) {
        showToast('入库失败�? + e.message, 'error');
      } finally {
        pasteBtn.disabled = false;
        pasteBtn.textContent = '入库';
      }
    });

    // ================================================================
    // 清空历史
    // ================================================================
    clearHistoryBtn.addEventListener('click', async () => {
      await fetch('/api/clear', { method: 'POST' });
      chatContainer.innerHTML = `
        <div class="welcome-card">
          <div class="welcome-icon">🤖</div>
          <h2>对话已清�?/h2>
          <p>可以开始新的对话了�?/p>
        </div>`;
      showToast('对话历史已清空�?, 'info');
    });

    // ================================================================
    // 事件绑定
    // ================================================================
    sendBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
    });

    refreshDocsBtn.addEventListener('click', loadDocuments);

    // ================================================================
    // 初始�?    // ================================================================
    loadStatus();
    loadDocuments();
    setInterval(loadStatus, 30_000);
  </script>
</body>
</html>
