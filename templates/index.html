<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 问答 Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<div class="app">

  <!-- ====== Sidebar ====== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div>
        <h1>RAG Demo</h1>
        <p class="subtitle">检索增强生成 AI 问答系统</p>
      </div>
      <button class="theme-toggle-btn" id="theme-toggle-btn" title="切换主题">🌓</button>
    </div>

    <!-- Settings -->
    <div class="settings-panel">
      <div class="settings-header" id="settings-toggle">
        <div class="settings-header-left">⚙️ 设置</div>
        <span class="settings-toggle-icon open" id="settings-arrow">▶</span>
      </div>
      <div class="settings-body" id="settings-body">
        <div class="settings-field">
          <label>API Key</label>
          <div class="pwd-wrapper">
            <input type="password" id="s-api-key" placeholder="sk-..." autocomplete="off" />
            <button type="button" class="pwd-toggle" id="pwd-toggle" title="显示/隐藏">👁</button>
          </div>
        </div>
        <div class="settings-field">
          <label>接口地址</label>
          <input type="text" id="s-base-url" placeholder="https://api.openai.com/v1" />
        </div>
        <div class="settings-field">
          <label>模型</label>
          <select id="s-model">
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="qwen-turbo">qwen-turbo</option>
            <option value="glm-4">glm-4</option>
            <option value="__custom__">自定义...</option>
          </select>
          <input type="text" id="s-model-custom" placeholder="输入自定义模型名称" style="display:none;margin-top:6px;" />
        </div>
        <div class="settings-field">
          <label>Embedding 模型</label>
          <select id="s-embedding">
            <option value="text-embedding-ada-002">text-embedding-ada-002 (OpenAI)</option>
            <option value="text-embedding-3-small">text-embedding-3-small (OpenAI)</option>
            <option value="step-1-8k">step-1-8k (StepFun)</option>
            <option value="__custom__">自定义...</option>
          </select>
          <input type="text" id="s-embedding-custom" placeholder="输入自定义 Embedding 模型名称" style="display:none;margin-top:6px;" />
        </div>
        <div class="settings-field">
          <label>温度：<span id="s-temp-val">0.3</span></label>
          <div class="temp-control">
            <span style="font-size:.75rem;color:var(--sidebar-muted)">0</span>
            <input type="range" id="s-temperature" min="0" max="2" step="0.1" value="0.3" />
            <span style="font-size:.75rem;color:var(--sidebar-muted)">2</span>
          </div>
        </div>
        <button class="btn-save-settings" id="save-settings-btn">保存设置</button>
        <p class="settings-hint">配置仅保存在本地 config.json，不会被同步到 Git。</p>
      </div>
    </div>

    <!-- Status -->
    <div class="status-panel">
      <h3>系统状态</h3>
      <div id="status-info" class="status-items">加载中...</div>
    </div>

    <!-- Upload -->
    <div class="section">
      <h3>上传文档</h3>
      <div class="upload-area" id="upload-area">
        <span class="upload-icon">+</span>
        <p>点击或拖拽上传文件<br><small>支持 .txt / .md / .pdf，最大 10MB</small></p>
        <input type="file" id="file-input" accept=".txt,.md,.pdf" hidden />
      </div>
      <button class="btn btn-secondary" id="upload-btn" style="display:none;margin-top:8px;">确认上传</button>
    </div>

    <!-- Paste Text -->
    <div class="section">
      <h3>粘贴文本</h3>
      <textarea id="paste-text" placeholder="在此粘贴要入库的文本内容..."></textarea>
      <button class="btn btn-primary" id="paste-btn" style="margin-top:8px;">入库</button>
    </div>

    <!-- Document Management -->
    <div class="section">
      <h3>文档管理</h3>
      <div id="doc-list" class="doc-list"><p class="doc-empty">加载中...</p></div>
      <button class="btn btn-secondary" id="refresh-docs-btn" style="margin-top:8px;">刷新列表</button>
    </div>

    <!-- Actions -->
    <div class="section">
      <button class="btn btn-danger" id="clear-history-btn">清空对话历史</button>
    </div>

    <div class="sidebar-footer">Flask + LangChain + ChromaDB</div>
  </aside>

  <!-- ====== Main Chat ====== -->
  <main class="main">
    <div class="chat-container" id="chat-container">
      <button class="export-btn" id="export-btn" title="导出对话">导出</button>
      <div class="welcome-card">
        <div class="welcome-icon">AI</div>
        <h2>你好，我是 RAG 问答助手</h2>
        <p>在下方输入问题，我会基于已上传的文档为你检索并生成回答。</p>
        <div id="context-badge" class="context-badge" style="display:none">
          <span>已加载对话上下文</span>
        </div>
        <div class="suggestions">
          <button class="chip" onclick="fillQuestion('人工智能的发展历程是怎样的？')">人工智能的发展历程是怎样的？</button>
          <button class="chip" onclick="fillQuestion('什么是图灵测试？')">什么是图灵测试？</button>
          <button class="chip" onclick="fillQuestion('深度学习革命始于什么时候？')">深度学习革命始于什么时候？</button>
          <button class="chip" onclick="fillQuestion('AI 安全与对齐面临哪些挑战？')">AI 安全与对齐面临哪些挑战？</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <input type="text" id="question-input" placeholder="输入你的问题，按 Enter 发送..." autocomplete="off" />
      <button class="btn-send" id="send-btn">发送</button>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script>
// ================================================================
// DOM Refs
// ================================================================
const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const pasteText = document.getElementById('paste-text');
const pasteBtn = document.getElementById('paste-btn');
const questionInput = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');
const chatContainer = document.getElementById('chat-container');
const clearHistoryBtn = document.getElementById('clear-history-btn');
const statusInfo = document.getElementById('status-info');
const toastContainer = document.getElementById('toast-container');
const docList = document.getElementById('doc-list');
const refreshDocsBtn = document.getElementById('refresh-docs-btn');
const contextBadge = document.getElementById('context-badge');
let selectedFile = null;

// ================================================================
// Theme Toggle
// ================================================================
(function() {
  const saved = localStorage.getItem('rag-demo-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-toggle-btn').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('rag-demo-theme', next);
  });
})();

// ================================================================
// Settings Panel
// ================================================================
const settingsBody = document.getElementById('settings-body');
document.getElementById('settings-toggle').addEventListener('click', () => {
  const isOpen = settingsBody.style.display !== 'none';
  settingsBody.style.display = isOpen ? 'none' : 'block';
  document.getElementById('settings-arrow').classList.toggle('open', !isOpen);
});

async function loadSettings() {
  try {
    const resp = await fetch('/api/settings');
    const data = await resp.json();
    if (data.status === 'ok') {
      const s = data.settings;
      document.getElementById('s-api-key').value = s.api_key || '';
      document.getElementById('s-base-url').value = s.base_url || '';
      document.getElementById('s-temperature').value = s.temperature || 0.3;
      document.getElementById('s-temp-val').textContent = s.temperature || 0.3;
      const modelSelect = document.getElementById('s-model');
      const modelCustom = document.getElementById('s-model-custom');
      const presets = ['gpt-3.5-turbo', 'gpt-4o', 'deepseek-chat', 'qwen-turbo', 'glm-4'];
      if (presets.includes(s.model_name)) {
        modelSelect.value = s.model_name;
        modelCustom.style.display = 'none';
      } else if (s.model_name) {
        modelSelect.value = '__custom__';
        modelCustom.value = s.model_name;
        modelCustom.style.display = 'block';
      }

      const embPresets = ['text-embedding-ada-002', 'text-embedding-3-small', 'step-1-8k'];
      const embSelect = document.getElementById('s-embedding');
      const embCustom = document.getElementById('s-embedding-custom');
      const embModel = s.embedding_model || 'text-embedding-ada-002';
      if (embPresets.includes(embModel)) {
        embSelect.value = embModel;
        embCustom.style.display = 'none';
      } else {
        embSelect.value = '__custom__';
        embCustom.value = embModel;
        embCustom.style.display = 'block';
      }
    }
  } catch (e) { console.error('Failed to load settings:', e); }
}

document.getElementById('save-settings-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-settings-btn');
  const orig = btn.textContent;
  btn.textContent = '保存中...'; btn.disabled = true;
  try {
    const ms = document.getElementById('s-model');
    const mc = document.getElementById('s-model-custom');
    const modelName = ms.value === '__custom__' ? mc.value.trim() : ms.value;
    const es = document.getElementById('s-embedding');
    const ec = document.getElementById('s-embedding-custom');
    const embModel = es.value === '__custom__' ? ec.value.trim() : es.value;
    const resp = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key: document.getElementById('s-api-key').value,
        base_url: document.getElementById('s-base-url').value,
        model_name: modelName,
        embedding_model: embModel,
        temperature: parseFloat(document.getElementById('s-temperature').value)
      })
    });
    const data = await resp.json();
    showToast(data.status === 'ok' ? '设置已保存' : '保存失败：' + data.message, data.status === 'ok' ? 'success' : 'error');
  } catch (e) {
    showToast('保存失败：' + e.message, 'error');
  } finally {
    btn.textContent = orig; btn.disabled = false;
  }
});

document.getElementById('s-temperature').addEventListener('input', e => {
  document.getElementById('s-temp-val').textContent = e.target.value;
});
document.getElementById('s-model').addEventListener('change', e => {
  document.getElementById('s-model-custom').style.display = e.target.value === '__custom__' ? 'block' : 'none';
});
document.getElementById('s-embedding').addEventListener('change', e => {
  document.getElementById('s-embedding-custom').style.display = e.target.value === '__custom__' ? 'block' : 'none';
});
document.getElementById('pwd-toggle').addEventListener('click', () => {
  const inp = document.getElementById('s-api-key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
loadSettings();

// ================================================================
// Toast
// ================================================================
function showToast(message, type = 'info') {
  const div = document.createElement('div');
  div.className = `toast toast-${type}`;
  div.textContent = message;
  toastContainer.appendChild(div);
  requestAnimationFrame(() => { div.classList.add('toast-out'); });
  setTimeout(() => div.remove(), 2800);
}

// ================================================================
// Markdown Rendering
// ================================================================
marked.setOptions({ breaks: true, gfm: true });
function renderMarkdown(text) {
  try {
    let html = marked.parse(text);
    html = html.replace(/<pre><code class="language-(\w*)">/g, '<pre><code class="language-$1">');
    return html;
  } catch (e) { return escHtml(text); }
}

// ================================================================
// Helpers
// ================================================================
function escHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML.replace(/\n/g, '<br>');
}
function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }
function removeWelcome() {
  const w = document.querySelector('.welcome-card');
  if (w) w.remove();
}

// ================================================================
// Chat Bubbles
// ================================================================
function createMessageBubble(role, content) {
  const wrapper = document.createElement('div');
  wrapper.className = `msg-bubble ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : 'AI';
  const body = document.createElement('div');
  body.className = 'msg-body';
  body.innerHTML = `<div class="msg-role">${role === 'user' ? '你' : '助手'}</div><div class="msg-text">${renderMarkdown(content)}</div>`;
  wrapper.appendChild(avatar); wrapper.appendChild(body);
  return wrapper;
}

function createAssistantBubble() {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-bubble assistant';
  const avatar = document.createElement('div');
  avatar.className = 'avatar'; avatar.textContent = 'AI';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role'; roleEl.textContent = '助手';
  const textEl = document.createElement('div');
  textEl.className = 'msg-text stream-cursor';
  body.appendChild(roleEl); body.appendChild(textEl);
  wrapper.appendChild(avatar); wrapper.appendChild(body);
  return { wrapper, textEl };
}

function createSourcesBlock(sources) {
  const block = document.createElement('div');
  block.className = 'sources-block';
  const header = document.createElement('div');
  header.className = 'sources-header';
  header.innerHTML = '📎 引用来源 <span class="sources-toggle">展开</span>';
  const list = document.createElement('div');
  list.className = 'sources-list';
  list.style.display = 'none';
  sources.forEach(s => {
    const item = document.createElement('div');
    item.className = 'source-item';
    const title = document.createElement('div');
    title.className = 'source-title';
    title.textContent = `[${s.idx}] ${s.file}${s.page ? ' (第' + s.page + '页)' : ''}`;
    const snippet = document.createElement('div');
    snippet.className = 'source-snippet';
    snippet.textContent = s.text;
    item.appendChild(title); item.appendChild(snippet);
    list.appendChild(item);
  });
  header.addEventListener('click', () => {
    const isOpen = list.style.display !== 'none';
    list.style.display = isOpen ? 'none' : 'block';
    header.querySelector('.sources-toggle').textContent = isOpen ? '展开' : '收起';
  });
  block.appendChild(header); block.appendChild(list);
  return block;
}

function addUserBubble(question) {
  removeWelcome();
  const b = createMessageBubble('user', question);
  chatContainer.appendChild(b);
  scrollToBottom();
}

// ================================================================
// Stream Chat
// ================================================================
async function sendStreamChat(question) {
  addUserBubble(question);
  const { wrapper, textEl } = createAssistantBubble();
  chatContainer.appendChild(wrapper);
  scrollToBottom();

  let fullAnswer = '';
  try {
    const resp = await fetch('/api/chat-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const msg = JSON.parse(line.slice(6));
          if (msg.type === 'token') {
            fullAnswer += msg.content;
            textEl.innerHTML = renderMarkdown(fullAnswer) + '<span class="stream-cursor"></span>';
            scrollToBottom();
          } else if (msg.type === 'sources') {
            const sourcesBlock = createSourcesBlock(msg.sources);
            wrapper.querySelector('.msg-body').appendChild(sourcesBlock);
          } else if (msg.type === 'error') {
            textEl.textContent = '错误：' + msg.message;
            textEl.classList.remove('stream-cursor');
          }
        } catch (e) {}
      }
    }
    textEl.innerHTML = renderMarkdown(fullAnswer);
    textEl.classList.remove('stream-cursor');
    textEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));

    // Save to session
    await fetch('/api/history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, answer: fullAnswer })
    });
    updateContextBadge();
  } catch (e) {
    textEl.textContent = '请求失败：' + e.message;
    textEl.classList.remove('stream-cursor');
  }
}

// ================================================================
// Non-stream Chat (fallback)
// ================================================================
async function sendChat(question) {
  addUserBubble(question);
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await resp.json();
    const wrapper = createMessageBubble('assistant', data.answer);
    chatContainer.appendChild(wrapper);
    wrapper.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (data.sources && data.sources.length > 0) {
      wrapper.querySelector('.msg-body').appendChild(createSourcesBlock(data.sources));
    }
    scrollToBottom();
  } catch (e) {
    chatContainer.appendChild(createMessageBubble('assistant', '请求失败：' + e.message));
  }
}

// ================================================================
// Context Badge
// ================================================================
async function updateContextBadge() {
  try {
    const resp = await fetch('/api/history');
    const data = await resp.json();
    contextBadge.style.display = data.history && data.history.length > 0 ? 'inline-flex' : 'none';
  } catch (e) { contextBadge.style.display = 'none'; }
}

// ================================================================
// File Upload
// ================================================================
uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  if (e.dataTransfer.files.length > 0) {
    selectedFile = e.dataTransfer.files[0];
    uploadArea.querySelector('p').textContent = selectedFile.name;
    uploadBtn.style.display = 'block';
  }
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    selectedFile = fileInput.files[0];
    uploadArea.querySelector('p').innerHTML = selectedFile.name + '<br><small>已选择</small>';
    uploadBtn.style.display = 'block';
  }
});
uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const formData = new FormData();
  formData.append('file', selectedFile);
  uploadBtn.disabled = true; uploadBtn.textContent = '上传中...';
  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    showToast(data.message, data.status === 'ok' ? 'success' : 'error');
    if (data.status === 'ok') { loadDocuments(); updateStatus(); }
  } catch (e) { showToast('上传失败：' + e.message, 'error'); }
  finally { uploadBtn.disabled = false; uploadBtn.textContent = '确认上传'; uploadBtn.style.display = 'none'; selectedFile = null; uploadArea.querySelector('p').innerHTML = '点击或拖拽上传文件<br><small>支持 .txt / .md / .pdf，最大 10MB</small>'; fileInput.value = ''; }
});

// ================================================================
// Paste Text
// ================================================================
pasteBtn.addEventListener('click', async () => {
  const text = pasteText.value.trim();
  if (!text) { showToast('请输入文本内容', 'error'); return; }
  pasteBtn.disabled = true; pasteBtn.textContent = '处理中...';
  try {
    const resp = await fetch('/api/paste', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await resp.json();
    showToast(data.message, data.status === 'ok' ? 'success' : 'error');
    if (data.status === 'ok') { pasteText.value = ''; loadDocuments(); updateStatus(); }
  } catch (e) { showToast('入库失败：' + e.message, 'error'); }
  finally { pasteBtn.disabled = false; pasteBtn.textContent = '入库'; }
});

// ================================================================
// Document Management
// ================================================================
async function loadDocuments() {
  try {
    const resp = await fetch('/api/documents');
    const data = await resp.json();
    if (data.status === 'ok') {
      if (data.documents.length === 0) {
        docList.innerHTML = '<p class="doc-empty">暂无文档，请先上传</p>';
      } else {
        docList.innerHTML = data.documents.map(d => `
          <div class="doc-item">
            <div class="doc-info">
              <div class="doc-name">${escHtml(d.filename)}</div>
              <div class="doc-chunks">${d.chunks} 个片段</div>
            </div>
            <button class="btn-delete" onclick="deleteDocument('${escHtml(d.filename).replace(/'/g, "\\'")}')">删除</button>
          </div>
        `).join('');
      }
    }
  } catch (e) { docList.innerHTML = '<p class="doc-empty">加载失败</p>'; }
}

async function deleteDocument(filename) {
  if (!confirm(`确定要删除「${filename}」吗？`)) return;
  try {
    const resp = await fetch('/api/documents', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename })
    });
    const data = await resp.json();
    showToast(data.message, data.status === 'ok' ? 'success' : 'error');
    loadDocuments(); updateStatus();
  } catch (e) { showToast('删除失败：' + e.message, 'error'); }
}
refreshDocsBtn.addEventListener('click', loadDocuments);

// ================================================================
// Status
// ================================================================
async function updateStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    statusInfo.innerHTML = `
      <div class="status-item"><span class="dot ${data.api_configured ? 'dot-green' : 'dot-red'}"></span>API 配置<span class="status-badge ${data.api_configured ? 'badge-ok' : 'badge-err'}">${data.api_configured ? '已配置' : '未配置'}</span></div>
      <div class="status-item"><span class="dot ${data.embeddings_ready ? 'dot-green' : 'dot-red'}"></span>Embedding<span class="status-badge ${data.embeddings_ready ? 'badge-ok' : 'badge-err'}">${data.embeddings_ready ? '就绪' : '未就绪'}</span></div>
      <div class="status-item"><span class="dot ${data.llm_ready ? 'dot-green' : 'dot-red'}"></span>LLM 模型<span class="status-badge ${data.llm_ready ? 'badge-ok' : 'badge-err'}">${data.llm_ready ? '就绪' : '未就绪'}</span></div>
      <div class="status-item"><span class="dot ${data.vectorstore_ready ? 'dot-green' : 'dot-red'}"></span>向量库<span class="status-badge ${data.vectorstore_ready ? 'badge-ok' : 'badge-err'}">${data.vectorstore_ready ? '就绪' : '未就绪'}</span></div>
    `;
  } catch (e) { statusInfo.innerHTML = '<div class="status-item">加载失败</div>'; }
}

// ================================================================
// Clear History
// ================================================================
clearHistoryBtn.addEventListener('click', async () => {
  await fetch('/api/clear', { method: 'POST' });
  showToast('对话历史已清空', 'success');
  chatContainer.innerHTML = `<button class="export-btn" id="export-btn" title="导出对话">导出</button>
    <div class="welcome-card">
      <div class="welcome-icon">AI</div>
      <h2>你好，我是 RAG 问答助手</h2>
      <p>在下方输入问题，我会基于已上传的文档为你检索并生成回答。</p>
      <div class="suggestions">
        <button class="chip" onclick="fillQuestion('人工智能的发展历程是怎样的？')">人工智能的发展历程是怎样的？</button>
        <button class="chip" onclick="fillQuestion('什么是图灵测试？')">什么是图灵测试？</button>
        <button class="chip" onclick="fillQuestion('深度学习革命始于什么时候？')">深度学习革命始于什么时候？</button>
        <button class="chip" onclick="fillQuestion('AI 安全与对齐面临哪些挑战？')">AI 安全与对齐面临哪些挑战？</button>
      </div>
    </div>`;
  contextBadge.style.display = 'none';
});

// ================================================================
// Export Chat
// ================================================================
document.getElementById('export-btn').addEventListener('click', async () => {
  const resp = await fetch('/api/history');
  const data = await resp.json();
  if (!data.history || data.history.length === 0) { showToast('没有对话记录', 'info'); return; }
  const md = data.history.map(m => `**${m.role === 'user' ? '你' : '助手'}** (${m.time})\n\n${m.content}\n`).join('\n---\n\n');
  const blob = new Blob(['# RAG Demo 对话记录\n\n' + md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `rag-chat-${new Date().toISOString().slice(0,10)}.md`;
  a.click(); URL.revokeObjectURL(url);
  showToast('已导出对话记录', 'success');
});

// ================================================================
// Send
// ================================================================
function fillQuestion(q) {
  sendStreamChat(q);
}

async function handleSend() {
  const q = questionInput.value.trim();
  if (!q) return;
  questionInput.value = '';
  questionInput.disabled = true; sendBtn.disabled = true;
  await sendStreamChat(q);
  questionInput.disabled = false; sendBtn.disabled = false;
  questionInput.focus();
}

sendBtn.addEventListener('click', handleSend);
questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

// ================================================================
// Init
// ================================================================
updateStatus();
loadDocuments();
updateContextBadge();
setInterval(updateStatus, 30000);
</script>
</body>
</html>
